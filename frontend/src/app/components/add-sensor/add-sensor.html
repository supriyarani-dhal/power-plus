<div class="space-y-6">
  <h2 class="text-xl font-semibold text-gray-200 mb-6">Add New Sensor</h2>

  <div class="flex justify-center">
    <div class="w-full max-w-3xl bg-gray-800 border border-gray-700 rounded-lg p-6">
      <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Sensor Name -->
        <div>
          <label class="form-label">Sensor Name</label>
          <input type="text" class="form-input" placeholder="Voltage Sensor V1" />
        </div>

        <!-- Sensor ID -->
        <div>
          <label class="form-label">Sensor ID</label>
          <input type="text" class="form-input" placeholder="SEN-VLT-01" />
        </div>

        <!-- Sensor Type -->
        <div>
          <label class="form-label">Type</label>
          <select class="form-input">
            <option value="temperature">Temperature</option>
            <option value="voltage">Voltage</option>
            <option value="current">Current</option>
          </select>
        </div>

        <!-- Unit -->
        <div>
          <label class="form-label">Unit</label>
          <input type="text" class="form-input" placeholder="°C / V / A" />
        </div>

        <!-- Device -->
        <div>
          <label class="form-label">Device</label>
          <select class="form-input">
            <option>Substation CH-01</option>
            <option>Feeder DL-02</option>
          </select>
        </div>

        <!-- Status -->
        <div>
          <label class="form-label">Status</label>
          <select class="form-input">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <!-- Enabled -->
        <div class="md:col-span-2 flex items-center gap-3 mt-2">
          <input type="checkbox" class="accent-indigo-500" />
          <span class="text-gray-300">Enable Sensor</span>
        </div>

        <!-- Actions -->
        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
          <button type="button" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Add Sensor</button>
        </div>
      </form>
    </div>
  </div>

  @if (showDeleteModal) {
  <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-lg w-full max-w-md p-6">
      <h3 class="text-lg font-semibold text-red-400 mb-3">Delete Confirmation</h3>

      <p class="text-gray-300">
        Are you sure you want to delete this item? This action cannot be undone.
      </p>

      <div class="flex justify-end gap-3 mt-6">
        <button class="btn-secondary" (click)="closeDelete()">Cancel</button>
        <button class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-white">Delete</button>
      </div>
    </div>
  </div>
  }
</div>
