<div class="space-y-6">
  <h2 class="text-xl font-semibold text-gray-200 mb-6">Add New Device</h2>

  <div class="flex justify-center">
    <div class="w-full max-w-3xl bg-gray-800 border border-gray-700 rounded-lg p-6">
      <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Device Name -->
        <div>
          <label class="form-label">Device Name</label>
          <input type="text" class="form-input" placeholder="Substation CH-01" />
        </div>

        <!-- Device ID -->
        <div>
          <label class="form-label">Device ID</label>
          <input type="text" class="form-input" placeholder="DEV-CH-01" />
        </div>

        <!-- Region -->
        <div>
          <label class="form-label">Region</label>
          <select class="form-input">
            <option>Northern Region</option>
            <option>Southern Region</option>
          </select>
        </div>

        <!-- Place -->
        <div>
          <label class="form-label">Place</label>
          <select class="form-input">
            <option>Chandigarh</option>
            <option>Delhi</option>
          </select>
        </div>

        <!-- Device Type -->
        <div>
          <label class="form-label">Device Type</label>
          <select class="form-input">
            <option>Substation</option>
            <option>Feeder</option>
            <option>Transformer</option>
          </select>
        </div>

        <!-- Status -->
        <div>
          <label class="form-label">Status</label>
          <select class="form-input">
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </div>

        <!-- Description -->
        <div class="md:col-span-2">
          <label class="form-label">Description</label>
          <textarea rows="3" class="form-input"></textarea>
        </div>

        <!-- Actions -->
        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
          <button type="button" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Add Device</button>
        </div>
      </form>
    </div>
  </div>
  @if (showDeleteModal) {
  <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-lg w-full max-w-md p-6">
      <h3 class="text-lg font-semibold text-red-400 mb-3">Delete Confirmation</h3>

      <p class="text-gray-300">
        Are you sure you want to delete this item? This action cannot be undone.
      </p>

      <div class="flex justify-end gap-3 mt-6">
        <button class="btn-secondary" (click)="closeDelete()">Cancel</button>
        <button class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-white">Delete</button>
      </div>
    </div>
  </div>
  }
</div>
