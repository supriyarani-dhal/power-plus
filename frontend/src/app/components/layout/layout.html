<div class="flex h-screen bg-gray-900 text-white">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 border-r border-gray-700 p-5 flex flex-col">
    <h1 class="text-xl font-bold mb-8">IoT Power Grid</h1>

    <!-- MONITORING -->
    <div class="mb-6">
      <p class="text-xs text-gray-500 uppercase mb-3 tracking-wider">Monitoring</p>

      <nav class="flex flex-col gap-3">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faChartLine"></fa-icon>
          Dashboard
        </a>

        <a routerLink="/regions" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faChartArea"></fa-icon>
          Region Overview
        </a>

        <a routerLink="/devices/manage" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faServer"></fa-icon>
          Device Management
        </a>

        <a routerLink="/sensors" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faBroadcastTower"></fa-icon>
          Sensor Management
        </a>

        <a routerLink="/alerts" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faBell"></fa-icon>
          Alerts
        </a>
      </nav>
    </div>

    <!-- MANAGEMENT -->
    <div class="mb-6">
      <p class="text-xs text-gray-500 uppercase mb-3 tracking-wider">Management</p>

      <nav class="flex flex-col gap-3">
        <a routerLink="/devices/add" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faPlusCircle"></fa-icon>
          Add Device
        </a>

        <a routerLink="/sensors/add" routerLinkActive="active" class="nav-item">
          <fa-icon [icon]="faMicrochip"></fa-icon>
          Add Sensor
        </a>
      </nav>
    </div>

    <!-- ACCOUNT -->
    <div class="mt-auto pt-5 border-t border-gray-700">
      <button (click)="logout()" class="flex items-center gap-2 text-red-400 hover:text-red-300">
        <fa-icon [icon]="faArrowRightFromBracket"></fa-icon>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Section -->
  <main class="flex-1 p-6 overflow-auto">
    <router-outlet />
  </main>
</div>
